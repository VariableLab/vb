name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller streamlit

    - name: Build EXE with PyInstaller
      run: |
        # 使用 PyInstaller 打包，并且把 web_app.py 作为数据文件包含进去
        pyinstaller --onefile --windowed --name="AI视频生成神器" --add-data "web_app.py;." --copy-metadata streamlit --collect-data streamlit run.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-App
        path: dist/AI视频生成神器.exe
