name: Build Desktop Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller streamlit

    - name: Build EXE with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --name="AI视频生成神器" --add-data "web_app.py;." --copy-metadata streamlit --collect-data streamlit run.py

    - name: Build APP with PyInstaller (Mac)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name="AI视频生成神器" --add-data "web_app.py:." --copy-metadata streamlit --collect-data streamlit run.py

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Windows-App
        path: dist/AI视频生成神器.exe

    - name: Zip Mac App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r "AI视频生成神器-Mac.zip" "AI视频生成神器.app"

    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Mac-App
        path: dist/AI视频生成神器-Mac.zip
