name: Build Desktop Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller streamlit pillow

    - name: Convert Icon
      shell: python
      run: |
        from PIL import Image
        import sys
        try:
            img = Image.open('app_icon.jpg')
            # 缩放成正方形并保存为 ico 和 icns
            img = img.resize((256, 256))
            img.save('app_icon.ico', format='ICO', sizes=[(256, 256)])
            img.save('app_icon.icns', format='ICNS')
        except Exception as e:
            print("Icon conversion failed:", e)

    - name: Build EXE with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --icon=app_icon.ico --name="AI视频生成神器" --add-data "web_app.py;." --hidden-import=streamlit.runtime.scriptrunner.magic_funcs --copy-metadata streamlit --collect-data streamlit run.py

    - name: Build APP with PyInstaller (Mac)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --icon=app_icon.icns --name="AI视频生成神器" --add-data "web_app.py:." --hidden-import=streamlit.runtime.scriptrunner.magic_funcs --copy-metadata streamlit --collect-data streamlit run.py

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Windows-App
        path: dist/AI视频生成神器.exe

    - name: Zip Mac App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r "AI视频生成神器-Mac.zip" "AI视频生成神器.app"

    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Mac-App
        path: dist/AI视频生成神器-Mac.zip
